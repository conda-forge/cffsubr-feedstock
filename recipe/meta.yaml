{% set name = "cffsubr" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cffsubr-{{ version }}.tar.gz
  sha256: 2c321b6807bd95856d921ed9dce8506495cf49fc7a89a63cb942e8bece13addd

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  skip: true  # [osx]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - make
  host:
    - pip
    - python
    - wheel
  run:
    - fonttools >=4.10.2
    - python

test:
  imports:
    - cffsubr
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/adobe-type-tools/cffsubr
  summary: Standalone CFF subroutinizer based on the AFDKO tx tool
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
